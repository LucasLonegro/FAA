# Sponsor -> entity rules. Tried in order; the first match wins.
#
# `pattern` is a regex searched in the *normalised* sponsor (see entities.normalize_sponsor): uppercase,
# "&" and apostrophes dropped (AT&T -> ATT, PG&E -> PGE), other punctuation -> space, trailing filer codes
# such as " - CS", "(MD)", ".NB", "-REGULATORY" stripped.
# `domains` are owner e-mail domains from FCC ASR (the FAA API no longer returns sponsor e-mails); they are
# matched exactly or as a parent domain and only used for ASR-owner attribution.
# `entity: null` with `from_name: true` uses the sponsor's own base name (legal suffixes and roman numerals
# dropped) as the entity, for long tails of utilities, agencies and small tower companies.
# entity_type `consultant` marks filing agents and engineering firms: no entity, ASR owner used instead.
#
# Ownership notes (checked 2026-10):
# - The Towers, LLC is a build-to-suit JV of Vertical Bridge REIT and Cellco (Verizon); kept separate from
#   Vertical Bridge because it is a direct read on Verizon's new-site program.
# - UScellular sold its wireless operations to T-Mobile (closed 2025-08-01) and renamed itself Array Digital
#   Infrastructure (NYSE: AD), a tower company. Filings under either name map to Array.
# - TowerCo sold its 2013 portfolio to SBA, then restarted as TowerCo 2013 LLC / TowerCo V-VI (still private).
# - CTGI = Communications Tower Group I (ASR owner domain ctowergroup.com), private.
# - Alltel Corporation is a Verizon subsidiary (ASR owner contact @verizonwireless.com).
# - CCATT, CCTM, Pinnacle Towers and Global Signal are Crown Castle vehicles; "Crown Castle for AT&T/T-Mobile"
#   filings are on carrier-leased towers Crown Castle manages.
# - DISH Wireless is EchoStar (NASDAQ: SATS).

rules:
  # --- listed tower companies
  - {pattern: '^AMERICAN TOWERS?\b|^ATC$|^ATC (TOWER SERVICES|SEQUOIA|OUTDOOR DAS)|^SPECTRASITE|^AMERICAN TOWER CORP', entity: American Tower, ticker: AMT, entity_type: tower_reit, domains: [americantower.com]}
  - {pattern: '^CROWN CASTLE|^CCATT\b|^CCTM\d|^PINNACLE TOWERS|^GLOBAL SIGNAL|^CC HOLDINGS|^CROWN COMMUNICATION', entity: Crown Castle, ticker: CCI, entity_type: tower_reit, domains: [crowncastle.com]}
  - {pattern: '^SBA\b', entity: SBA Communications, ticker: SBAC, entity_type: tower_reit, domains: [sbasite.com, sbacomm.com]}
  - {pattern: '^US CELLULAR|^U S CELLULAR|^UNITED STATES CELLULAR|^USCC\b|^ARRAY DIGITAL', entity: Array Digital Infrastructure, ticker: AD, entity_type: towerco, domains: [arrayinc.com, uscellular.com]}

  # --- national carriers
