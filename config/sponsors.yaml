  - {pattern: '^ATT\b|^AT AND T\b|^AT T\b|^NEW CINGULAR|^CINGULAR|^LOS ANGELES SMSA|^ALASCOM|^SBC\b', entity: AT&T, ticker: T, entity_type: carrier, domains: [att.com, attws.com, cingular.com]}
  - {pattern: '^T ?MOBILE|^SPRINT\b|^SPRINTCOM|^NEXTEL|^OMNIPOINT|^POWERTEL|^VOICESTREAM|^METROPCS|^STC (ONE|TWO|FIVE|SIX)\b', entity: T-Mobile, ticker: TMUS, entity_type: carrier, domains: [t-mobile.com, sprint.com, sprintspectrum.com, nextel.com, sprintpcs.com]}
  - {pattern: '^DISH\b|^ECHOSTAR|^BOOST MOBILE', entity: EchoStar (DISH), ticker: SATS, entity_type: carrier, domains: [dish.com, echostar.com, dishwireless.com]}

  # --- other carriers
