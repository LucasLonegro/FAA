[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "faa-oe"
version = "0.1.0"
description = "FAA obstruction-evaluation filings as an alt-data signal for tower and carrier builds"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "lxml>=5",
    "polars>=1.0",
    "pyarrow>=15",
    "duckdb>=1.0",
    "pyyaml>=6",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jupyter",
    "nbconvert>=7",
    "ipykernel",
    "matplotlib>=3.8",
    "plotly>=5.20",
]

[project.scripts]
faa-oe = "faa_oe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits the real FAA API (deselected by default; run with -m live)"]
